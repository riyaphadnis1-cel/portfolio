<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EatSure Redesign — Cognitive Ergonomics Case Study by Riya Phadnis" />
    <title>EatSure Redesign — Riya Phadnis-UX Designer</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=small" />
    <link rel="icon" type="image/png" href="assets/favicon.png?v=small" />
    <link rel="stylesheet" href="styles.css?v=eatsure1" />
  </head>
  <body class="case-study-body">
    <!-- Top-left fixed < Back button in orange (no pill), visible when scrolling up -->
    <a href="index.html#projects" class="project-back-btn" id="project-back-btn" aria-label="Back to projects">&lt; Back</a>

    <!-- Vertical Roadmap Navigation on Left Side -->
    <aside class="project-roadmap" aria-label="Project section roadmap" id="project-roadmap">
      <div class="roadmap-track">
        <div class="roadmap-nodes">
          <button type="button" class="roadmap-node active" data-target="overview" aria-label="Overview">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Overview</span>
          </button>
          <button type="button" class="roadmap-node" data-target="app-analysis" aria-label="App Analysis">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| App Analysis</span>
          </button>
          <button type="button" class="roadmap-node" data-target="redesign" aria-label="Redesign">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Redesign</span>
          </button>
          <button type="button" class="roadmap-node" data-target="takeaways" aria-label="Takeaways">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Takeaways</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Continuous Image Train Case Study (Zero Background Padding, Edge to Edge) -->
    <main class="eatsure-case-study" id="case-study">
      <!-- 1. Overview -->
      <section class="eatsure-section" id="overview">
        <img src="assets/eatsure_overview.png" alt="EatSure Overview" loading="eager" decoding="async">
      </section>

      <!-- 2. App Analysis (1 to 8) -->
      <section class="eatsure-section" id="app-analysis">
        <img src="assets/eatsure_appanalysis1.png" alt="EatSure App Analysis Part 1" loading="lazy" decoding="async">
        <img src="assets/eatsure_appanalysis2.png" alt="EatSure App Analysis Part 2" loading="lazy" decoding="async">
        <img src="assets/eatsure_appanalysis3.png" alt="EatSure App Analysis Part 3" loading="lazy" decoding="async">
        <img src="assets/eatsure_appanalysis4.png" alt="EatSure App Analysis Part 4" loading="lazy" decoding="async">
        <img src="assets/eatsure_appanalysis5.png" alt="EatSure App Analysis Part 5" loading="lazy" decoding="async">
        <img src="assets/eatsure_appanalysis6.png" alt="EatSure App Analysis Part 6" loading="lazy" decoding="async">
        <img src="assets/eatsure_appanalysis7.png" alt="EatSure App Analysis Part 7" loading="lazy" decoding="async">
        <img src="assets/eatsure_appanalysis8.png" alt="EatSure App Analysis Part 8" loading="lazy" decoding="async">
      </section>

      <!-- 3. Redesign (1 to 5) -->
      <section class="eatsure-section" id="redesign">
        <img src="assets/eatsure_redesign1.png" alt="EatSure Redesign Part 1" loading="lazy" decoding="async">
        <img src="assets/eatsure_redesign2.png" alt="EatSure Redesign Part 2" loading="lazy" decoding="async">
        <img src="assets/eatsure_redesign3.png" alt="EatSure Redesign Part 3" loading="lazy" decoding="async">
        <img src="assets/eatsure_redesign4.png" alt="EatSure Redesign Part 4" loading="lazy" decoding="async">
        <img src="assets/eatsure_redesign5.png" alt="EatSure Redesign Part 5" loading="lazy" decoding="async">
      </section>

      <!-- 4. Takeaways -->
      <section class="eatsure-section" id="takeaways">
        <img src="assets/eatsure_takeaways.png" alt="EatSure Takeaways" loading="lazy" decoding="async">
      </section>
    </main>

    <script src="script.js?v=eatsure1"></script>
  </body>
</html>
