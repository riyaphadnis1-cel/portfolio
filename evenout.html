<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EvenOut — Mitigating the Social Cost of Debt Case Study by Riya Phadnis" />
    <title>EvenOut — Riya Phadnis-UX Designer</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=small" />
    <link rel="icon" type="image/png" href="assets/favicon.png?v=small" />
    <link rel="stylesheet" href="styles.css?v=evenout1" />
  </head>
  <body class="case-study-body">
    <!-- Top-left fixed < Back button in orange (no pill), visible when scrolling up -->
    <a href="index.html#projects" class="project-back-btn" id="project-back-btn" aria-label="Back to projects">&lt; Back</a>

    <!-- Vertical Roadmap Navigation on Left Side -->
    <aside class="project-roadmap" aria-label="Project section roadmap" id="project-roadmap">
      <div class="roadmap-track">
        <div class="roadmap-nodes">
          <button type="button" class="roadmap-node active" data-target="overview" aria-label="Overview">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Overview</span>
          </button>
          <button type="button" class="roadmap-node" data-target="problem" aria-label="Problem">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Problem</span>
          </button>
          <button type="button" class="roadmap-node" data-target="research" aria-label="Research">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Research</span>
          </button>
          <button type="button" class="roadmap-node" data-target="ideation" aria-label="Ideation">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Ideation</span>
          </button>
          <button type="button" class="roadmap-node" data-target="about" aria-label="About">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| About</span>
          </button>
          <button type="button" class="roadmap-node" data-target="version-1" aria-label="Version 1">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Version 1</span>
          </button>
          <button type="button" class="roadmap-node" data-target="testing" aria-label="Testing">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Testing</span>
          </button>
          <button type="button" class="roadmap-node" data-target="final-ui" aria-label="Final UI">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Final UI</span>
          </button>
          <button type="button" class="roadmap-node" data-target="takeaways" aria-label="Takeaways">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Takeaways</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Continuous Image Train Case Study (Zero Background Padding, Edge to Edge) -->
    <main class="evenout-case-study" id="case-study">
      <!-- 1. Overview -->
      <section class="evenout-section" id="overview">
        <img src="assets/evenout_overview.png" alt="EvenOut Overview" loading="eager" decoding="async">
      </section>

      <!-- 2. Problem -->
      <section class="evenout-section" id="problem">
        <img src="assets/evenout_problem.png" alt="EvenOut Problem" loading="lazy" decoding="async">
      </section>

      <!-- 3. Research (1 & 2) -->
      <section class="evenout-section" id="research">
        <img src="assets/evenout_research1.png" alt="EvenOut Research Part 1" loading="lazy" decoding="async">
        <img src="assets/evenout_research2.png" alt="EvenOut Research Part 2" loading="lazy" decoding="async">
      </section>

      <!-- 4. Ideation -->
      <section class="evenout-section" id="ideation">
        <img src="assets/evenout_ideation.png" alt="EvenOut Ideation" loading="lazy" decoding="async">
      </section>

      <!-- 5. About the app -->
      <section class="evenout-section" id="about">
        <img src="assets/evenout_aboutapp.png" alt="EvenOut About the App" loading="lazy" decoding="async">
      </section>

      <!-- 6. Version 1 -->
      <section class="evenout-section" id="version-1">
        <img src="assets/evenout_version1.png" alt="EvenOut Version 1" loading="lazy" decoding="async">
      </section>

      <!-- 7. Testing (1 & 2) -->
      <section class="evenout-section" id="testing">
        <img src="assets/evenout_testing1.png" alt="EvenOut Testing Part 1" loading="lazy" decoding="async">
        <img src="assets/evenout_testing2.png" alt="EvenOut Testing Part 2" loading="lazy" decoding="async">
      </section>

      <!-- 8. Final UI (1 & 2) -->
      <section class="evenout-section" id="final-ui">
        <img src="assets/evenout_finalui1.png" alt="EvenOut Final UI Part 1" loading="lazy" decoding="async">
        <img src="assets/evenout_finalui2.png" alt="EvenOut Final UI Part 2" loading="lazy" decoding="async">
      </section>

      <!-- 9. Takeaways -->
      <section class="evenout-section" id="takeaways">
        <img src="assets/evenout_takeaways.png" alt="EvenOut Takeaways" loading="lazy" decoding="async">
      </section>
    </main>

    <script src="script.js?v=evenout1"></script>
  </body>
</html>
