<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Making ride-hailing work for our cities — Sustainable UX Case Study by Riya Phadnis" />
    <title>Making ride-hailing work for our cities — Riya Phadnis-UX Designer</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=small" />
    <link rel="icon" type="image/png" href="assets/favicon.png?v=small" />
    <link rel="stylesheet" href="styles.css?v=sustainable1" />
  </head>
  <body class="case-study-body">
    <!-- Top-left fixed < Back button in orange (no pill), visible when scrolling up -->
    <a href="index.html#projects" class="project-back-btn" id="project-back-btn" aria-label="Back to projects">&lt; Back</a>

    <!-- Vertical Roadmap Navigation on Left Side -->
    <aside class="project-roadmap" aria-label="Project section roadmap" id="project-roadmap">
      <div class="roadmap-track">
        <div class="roadmap-nodes">
          <button type="button" class="roadmap-node active" data-target="overview" aria-label="Overview">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Overview</span>
          </button>
          <button type="button" class="roadmap-node" data-target="research" aria-label="Research">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Research</span>
          </button>
          <button type="button" class="roadmap-node" data-target="project-scope" aria-label="Project Scope">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Project Scope</span>
          </button>
          <button type="button" class="roadmap-node" data-target="pain-points" aria-label="Pain Points">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Pain Points</span>
          </button>
          <button type="button" class="roadmap-node" data-target="process" aria-label="Process">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Process</span>
          </button>
          <button type="button" class="roadmap-node" data-target="ux-models" aria-label="Sustainable UX models">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Sustainable UX models</span>
          </button>
          <button type="button" class="roadmap-node" data-target="design-brief" aria-label="Design Brief">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Design Brief</span>
          </button>
          <button type="button" class="roadmap-node" data-target="solution" aria-label="Solution">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Solution</span>
          </button>
          <button type="button" class="roadmap-node" data-target="takeaways" aria-label="Takeaways">
            <span class="roadmap-square"></span>
            <span class="roadmap-label">| Takeaways</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Continuous Image Train Case Study (Zero Background Padding, Edge to Edge) -->
    <main class="sustainable-case-study" id="case-study">
      <!-- 1. Overview -->
      <section class="sustainable-section" id="overview">
        <img src="assets/sustainable_overview.png" alt="Sustainable UX Overview" loading="eager" decoding="async">
      </section>

      <!-- 2. Research -->
      <section class="sustainable-section" id="research">
        <img src="assets/sustainable_research.png" alt="Sustainable UX Research" loading="lazy" decoding="async">
      </section>

      <!-- 3. Project Scope -->
      <section class="sustainable-section" id="project-scope">
        <img src="assets/sustainable_projectscope.png" alt="Sustainable UX Project Scope" loading="lazy" decoding="async">
      </section>

      <!-- 4. Pain Points -->
      <section class="sustainable-section" id="pain-points">
        <img src="assets/sustainable_painpoints.png" alt="Sustainable UX Pain Points" loading="lazy" decoding="async">
      </section>

      <!-- 5. Process -->
      <section class="sustainable-section" id="process">
        <img src="assets/sustainable_process.png" alt="Sustainable UX Process" loading="lazy" decoding="async">
      </section>

      <!-- 6. Sustainable UX models (1 & 2) -->
      <section class="sustainable-section" id="ux-models">
        <img src="assets/sustainable_models1.png" alt="Sustainable UX Models Part 1" loading="lazy" decoding="async">
        <img src="assets/sustainable_models2.png" alt="Sustainable UX Models Part 2" loading="lazy" decoding="async">
      </section>

      <!-- 7. Design Brief -->
      <section class="sustainable-section" id="design-brief">
        <img src="assets/sustainable_designbrief.png" alt="Sustainable UX Design Brief" loading="lazy" decoding="async">
      </section>

      <!-- 8. Solution (1, 2, 3, 4) -->
      <section class="sustainable-section" id="solution">
        <img src="assets/sustainable_solution1.png" alt="Sustainable UX Solution Part 1" loading="lazy" decoding="async">
        <img src="assets/sustainable_solution2.png" alt="Sustainable UX Solution Part 2" loading="lazy" decoding="async">
        <img src="assets/sustainable_solution3.png" alt="Sustainable UX Solution Part 3" loading="lazy" decoding="async">
        <img src="assets/sustainable_solution4.png" alt="Sustainable UX Solution Part 4" loading="lazy" decoding="async">
      </section>

      <!-- 9. Takeaways -->
      <section class="sustainable-section" id="takeaways">
        <img src="assets/sustainable_takeaways.png" alt="Sustainable UX Takeaways" loading="lazy" decoding="async">
      </section>
    </main>

    <script src="script.js?v=sustainable1"></script>
  </body>
</html>
